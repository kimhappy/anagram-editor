name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix develop .#ci --command cargo fmt --check
      - run: nix develop .#ci --command cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
      - run: nix develop .#ci --command cargo clippy --lib --bins -- -D warnings
      - run: nix develop .#ci --command cargo test --lib --target x86_64-unknown-linux-gnu

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix develop .#miri --command cargo miri test --lib --target x86_64-unknown-linux-gnu

  build:
    needs: [check, miri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix develop .#release --command trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
